<!doctype html>
<html lang="en" ng-app="reviewsApp">
<head>
  <meta charset="utf-8">
  <title>Review Manager</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/bootstrap-icons.css" rel="stylesheet">
  <link href="css/templatemo-ebook-landing.css" rel="stylesheet">
  <style>
    body {
      padding: 2rem;
      background: var(--section-bg-color);
      font-family: 'Unbounded', sans-serif;
    }
    h2, h5 { font-weight: 600; }
    .card {
      margin-bottom: 1rem;
      border-radius: 1rem;
      box-shadow: 0 2px 20px rgba(0,0,0,0.05);
    }
    .form-control { margin-bottom: 0.75rem; }
    .btn + .btn { margin-left: 0.5rem; }
    .img-thumbnail {
      border-radius: 0.75rem;
    }
  </style>
</head>
<body ng-controller="ReviewsController">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="text-dark">Manage Book Reviews</h2>
      <p class="text-muted">Use this panel to add, edit, or delete reviews from your landing page.</p>
    </div>

    <!-- Review Form -->
    <div class="card p-4 mb-4 bg-white">
      <h5 class="mb-3">Add New Review</h5>
      <form ng-submit="addReview()">
        <input type="text" class="form-control" ng-model="newReview.name" placeholder="Name" required>
        <input type="text" class="form-control" ng-model="newReview.role" placeholder="Role" required>
        <input type="number" class="form-control" ng-model="newReview.rating" min="1" max="5" placeholder="Rating (1-5)" required>
        <textarea class="form-control" ng-model="newReview.comment" placeholder="Comment" required></textarea>
        <input type="text" class="form-control" ng-model="newReview.avatar" placeholder="Avatar URL (optional)">
        <button class="btn custom-btn btn-naira w-100">Submit</button>
      </form>
    </div>

    <!-- Review Cards -->
    <div class="row">
      <div class="col-md-4" ng-repeat="review in reviews">
        <div class="custom-block d-flex flex-column bg-white p-3">
          <img ng-src="{{review.avatar}}" class="img-thumbnail mb-2 mx-auto" ng-if="review.avatar">
          <div class="text-center">
            <h5>{{review.name}}</h5>
            <small class="text-muted">{{review.role}}</small>
            <p class="my-2"><strong>Rating:</strong> {{review.rating}}</p>
            <p>{{review.comment}}</p>
          </div>

          <div class="text-center">
            <button class="btn btn-sm btn-outline-warning" ng-click="startEdit(review)">Edit</button>
            <button class="btn btn-sm btn-outline-danger" ng-click="deleteReview(review.id)">Delete</button>
          </div>

          <div ng-if="editingReview && editingReview.id === review.id" class="mt-3">
            <textarea class="form-control" ng-model="editingReview.comment"></textarea>
            <div class="text-end mt-2">
              <button class="btn btn-success btn-sm" ng-click="saveEdit()">Save</button>
              <button class="btn btn-secondary btn-sm" ng-click="cancelEdit()">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    angular.module('reviewsApp', [])
      .controller('ReviewsController', function ($scope, $http) {
        $scope.reviews = [];
        $scope.newReview = {};
        $scope.editingReview = null;

        $http.get('http://localhost:3000/api/reviews').then(res => {
          $scope.reviews = res.data;
        });

        $scope.addReview = function () {
          $http.post('http://localhost:3000/api/reviews', $scope.newReview).then(res => {
            $scope.reviews.push(res.data);
            $scope.newReview = {};
          });
        };

        $scope.startEdit = function (review) {
          $scope.editingReview = angular.copy(review);
        };

        $scope.cancelEdit = function () {
          $scope.editingReview = null;
        };

        $scope.saveEdit = function () {
          $http.put('http://localhost:3000/api/reviews/' + $scope.editingReview.id, $scope.editingReview).then(() => {
            const index = $scope.reviews.findIndex(r => r.id === $scope.editingReview.id);
            $scope.reviews[index] = angular.copy($scope.editingReview);
            $scope.editingReview = null;
          });
        };

        $scope.deleteReview = function (id) {
          $http.delete('http://localhost:3000/api/reviews/' + id).then(() => {
            $scope.reviews = $scope.reviews.filter(r => r.id !== id);
          });
        };
      });
  </script>
</body>
</html>
